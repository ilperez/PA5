<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
</head>
<body>
    
    <form action="" method="post">

        <h2>Custom Sneaker Order Form</h2>

        <label for="form-name">Name:</label> 
        <input type="text" name="username" id="form-name" class="textinput">
    
        <label for="form-email">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="textinput">

        <label for="form-tel">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="textinput">

        <label for="form-story">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long"></textarea>
        
        <label for="sizes">Size:</label>
        <select name="size" id="sizes">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">
            <legend>Color</legend>
            <label><input type="radio" name="color" value="red"> Red</label>
            <label><input type="radio" name="color" value="blue"> Blue</label> 
            <label><input type="radio" name="color" value="black"> Black</label> 
            <label><input type="radio" name="color" value="silver"> Silver</label>
        </fieldset>
            
        <label for="features">Add-on Features:</label>
        <fieldset id="features">
            <legend>Feature</legend>
            <label><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
            <label><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
            <label><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
            <label><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
        </fieldset>
            
        <input type="submit" value="ENTER">
    </form>
</body>
</html>
